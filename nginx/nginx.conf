# WasteFlow AI — Phase 1 local reverse proxy.
#
#   Browser -> Nginx :80 --/api/*, /health--> FastAPI 127.0.0.1:8000
#                        --everything else--> Vite dev server 127.0.0.1:5173
#
# Run from the repo root (see nginx/README.md):
#   nginx -p nginx/ -c nginx.conf
#
# CORS: the browser only talks to http://localhost (one origin), so Nginx adds
# NO CORS headers. FastAPI's CORSMiddleware is the single owner of CORS rules.

worker_processes 1;
error_log logs/error.log warn;
pid       logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log logs/access.log;

    # Lets the same location handle plain HTTP and the Vite HMR WebSocket.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream fastapi {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    upstream vite {
        server 127.0.0.1:5173;
    }

    server {
        listen 80;
        server_name localhost;

        # --- Backend API -------------------------------------------------
        location /api/ {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Connection "";   # needed for upstream keepalive

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            error_page 502 503 504 = @api_unavailable;
        }

        # --- Health check (exact match; FastAPI serves it at /health) -----
        location = /health {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;

            error_page 502 503 504 = @api_unavailable;
        }

        location @api_unavailable {
            default_type application/json;
            return 502 '{"detail":"FastAPI is not reachable on 127.0.0.1:8000"}';
        }

        # --- Frontend (Vite dev server, incl. HMR WebSocket) ---------------
        location / {
            proxy_pass http://vite;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;   # keep the HMR socket alive
        }
    }
}
